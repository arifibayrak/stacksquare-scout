<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stacksquare Scout</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0e0d0b;
        color: #f0ebdf;
      }
      .wrap { padding: 16px; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      .mark { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 16px; height: 16px; }
      .mark span { background: #f0ebdf; border-radius: 2px; }
      .mark span:last-child { background: #1d3fbf; }
      .row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
      .label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
      .switch { position: relative; width: 46px; height: 26px; }
      .switch input { display: none; }
      .slider {
        position: absolute; inset: 0; cursor: pointer; border-radius: 999px;
        background: #2b2823; transition: background 0.2s;
      }
      .slider::before {
        content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px;
        border-radius: 50%; background: #f0ebdf; transition: transform 0.2s;
      }
      input:checked + .slider { background: #1d3fbf; }
      input:checked + .slider::before { transform: translateX(20px); }
      .status { margin-top: 14px; font-size: 12px; color: #867e70; min-height: 16px; }
      .target { margin-top: 8px; font-size: 12px; }
      .target b { color: #8ba3f5; font-weight: 600; }
      .foot { margin-top: 16px; border-top: 1px solid #2b2823; padding-top: 10px; display: flex; justify-content: space-between; font-size: 12px; }
      a { color: #8ba3f5; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <div class="mark"><span></span><span></span><span></span><span></span></div>
        Stacksquare Scout
      </div>
      <div class="row">
        <span class="label">Scouting</span>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <span class="label">Log DMs</span>
        <label class="switch">
          <input type="checkbox" id="dmtoggle" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="status" id="status"></div>
      <div class="target" id="target"></div>
      <div class="foot">
        <a href="#" id="open-options">Settings</a>
        <a href="https://stacksquare.ai/admin/scout" target="_blank">Queue ↗</a>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
